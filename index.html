<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GarudaEdukasi - Dashboard Interaktif</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f4f6f9;
    }
    /* Mengatur sidebar agar memiliki tinggi penuh dan posisi melayang saat scroll */
    .sidebar-container {
      background-color: #ffffff;
      border-right: 1px solid #e3e6f0;
      min-height: calc(100vh - 56px);
      padding: 20px;
    }
    .sticky-sidebar {
      position: -webkit-sticky;
      position: sticky;
      top: 20px;
    }
    /* Styling menu navigasi sidebar */
    .nav-menu .nav-link {
      color: #4e73df;
      font-weight: 500;
      padding: 10px 15px;
      border-radius: 5px;
      margin-bottom: 5px;
      transition: all 0.2s ease;
    }
    .nav-menu .nav-link:hover, .nav-menu .nav-link.active {
      background-color: #f0f3ff;
      color: #2e59d9;
    }
    /* Frame Kuis di dalam sidebar */
    .quiz-card {
      border: 1px solid #e3e6f0;
      border-radius: 8px;
      overflow: hidden;
    }
    .quiz-iframe {
      width: 100%;
      height: 480px; /* Tinggi optimal untuk widget kuis sidebar */
      border: none;
    }
    /* Area Konten Utama */
    .content-container {
      padding: 30px;
    }
    .content-card {
      background: #ffffff;
      border: none;
      border-radius: 8px;
      box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.05);
    }
    .hidden-content {
      display: none;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="bi bi-shield-fill-check me-2 text-success"></i>
        <strong>GarudaEdukasi Portal</strong>
      </a>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      
      <aside class="col-xl-4 col-lg-5 sidebar-container">
        <div class="sticky-sidebar">
          
          <h6 class="text-muted text-uppercase font-weight-bold mb-3 small">Modul Edukasi</h6>
          <nav class="nav flex-column nav-menu mb-4">
            <a class="nav-link active" href="#" onclick="switchContent('pancasila-dasar', this)">
              <i class="bi bi-book me-2"></i> Pengantar Nilai Pancasila
            </a>
            <a class="nav-link" href="#" onclick="switchContent('butir-pengamalan', this)">
              <i class="bi bi-journal-text me-2"></i> Butir-Butir Pengamalan
            </a>
            <a class="nav-link" href="#" onclick="switchContent('sejarah-singkat', this)">
              <i class="bi bi-hourglass-split me-2"></i> Sejarah Lahirnya Pancasila
            </a>
          </nav>
          
          <h6 class="text-muted text-uppercase font-weight-bold mb-2 small">Kuis Interaktif</h6>
          <div class="card quiz-card shadow-sm">
            <div class="card-header bg-success text-white py-2 px-3 small d-flex align-items-center">
              <i class="bi bi-lightning-charge-fill me-2"></i> <strong>Live Quiz: Pancasila</strong>
            </div>
            <div class="card-body p-0">
              <iframe 
                src="https://script.google.com/macros/s/AKfycbyX_OE1eoE7CzSqDhcwRwaEsWjeR88B5B_1oFOQhazKk5LGIVE6Hexdy4-okGUNaQaG/exec"
